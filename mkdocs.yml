site_name: EcoRide · Documentación

theme:
  name: material
  palette:
    # Modo claro
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny

    # Modo oscuro
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night

plugins:
  - search

nav:
  - Inicio: index.md
  - Instalación: instalacio.md
  - Funcionalidades: funcionalitats.md
  - Arquitectura: arquitectura.md
  - API: api.md
  - Preguntas frecuentes: faq.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
